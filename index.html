<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Calculator</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Budget Calculator</h1>
    <p class="subtitle">Track your monthly income and expenses.</p>

    <div class="field">
      <label for="income">Monthly income</label>
      <input id="income" type="text" inputmode="decimal" placeholder="e.g. 5000">
    </div>
    <div class="field">
      <label for="rent">Rent</label>
      <input id="rent" type="text" inputmode="decimal" placeholder="e.g. 1500">
    </div>
    <div class="field">
      <label for="food">Food</label>
      <input id="food" type="text" inputmode="decimal" placeholder="e.g. 1200">
    </div>
    <div class="field">
      <label for="transport">Transport</label>
      <input id="transport" type="text" inputmode="decimal" placeholder="e.g. 400">
    </div>
    <div class="field">
      <label for="other">Other</label>
      <input id="other" type="text" inputmode="decimal" placeholder="e.g. 300">
    </div>

    <button id="calculate-btn" type="button">Calculate</button>

    <p id="message" class="message"></p>

    <section class="results">
      <p>Total expenses: <strong id="total-expenses">-</strong></p>
      <p>Remaining balance: <strong id="remaining-balance">-</strong></p>
      <p>Status: <strong id="status">-</strong></p>
    </section>
  </main>
</body>
</html>
